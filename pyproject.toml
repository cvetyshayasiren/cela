[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cela"
version = "0.1.0"
description = "A colorful cellular automaton that lives in your terminal"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "cvetyshayasiren" },
]
dependencies = [
    "numpy>=1.24",
]

[project.urls]
Homepage = "https://github.com/cvetyshayasiren/cela"
Issues = "https://github.com/cvetyshayasiren/cela/issues"

[project.scripts]
cela = "cela:main"

[tool.setuptools]
py-modules = ["cela", "config", "debug"]
packages = [
    "alignment",
    "caparams",
    "cellular_automaton",
    "parsing",
    "player",
    "randomisation",
    "render",
    "utils",
]
